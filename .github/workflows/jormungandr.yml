name: Gerar Jörmungandr

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Gerar animação de contribuições
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar Jörmungandr
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/jormungandr.svg?color_snake=#2563EB&color_dots=#EBEDF0,#BAE6FD,#7DD3FC,#22D3EE,#2563EB
            dist/jormungandr_dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0B1220,#1E293B,#2563EB,#06B6D4,#22D3EE

      - name: Publicar animações
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true